<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Arffornia Launcher</title>
    <!--
      Content Security Policy. Keep the host lists in sync with src/renderer/src/js/*.js and
      the image sources (website API, Modrinth CDN, avatar/skin services).
      style-src needs 'unsafe-inline' for Vue scoped styles in dev and static style attributes.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://arffornia.com https://www.arffornia.com https://cdn.modrinth.com https://minotar.net https://mineskin.eu;
        font-src 'self' data:;
        connect-src 'self' https://arffornia.com https://www.arffornia.com https://api.mcstatus.io https://api.modrinth.com https://raw.githubusercontent.com https://mineskin.eu;
        media-src 'self';
        object-src 'none';
        frame-src 'none';
        worker-src 'none';
        base-uri 'self';
        form-action 'none'"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
