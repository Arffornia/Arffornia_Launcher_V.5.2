name: Feature request
description: Suggest an improvement to the launcher.
labels: ["type: feature", "area: launcher"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Alternatives you considered.
