name: Build and Release

# Stable releases only: these are what every player's launcher updates to (releases/latest).
# Pre-release tags such as v0.1.16-beta.1 never match, and the rolling `beta` pre-release is
# published by beta.yml (spec 016, phase 1), never from a tag.
on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # electron-builder creates the release and uploads the installers

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Second lock after the tag filter: the tag must be a stable vX.Y.Z equal to package.json.
      # electron-builder publishes to v<package.json version>, so a mismatch would publish
      # somewhere else than the tag says.
      - name: Tag is a stable version that matches package.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a stable vX.Y.Z tag; players only get stable releases"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # GITHUB_TOKEN instead of the GH_TOKEN PAT (ADR-0015): scoped to this repo and this run.
      - name: Publish to GitHub
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After every publish: players must still get the newest stable version.
  guard:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: releases/latest is the newest stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check-stable-latest.mjs "$GITHUB_REPOSITORY"

      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Release guard failed: players may not get the stable launcher" \
            --body "The post-publish check failed after ${GITHUB_REF_NAME}: ${RUN_URL}. Check releases/latest before anything else is published."
